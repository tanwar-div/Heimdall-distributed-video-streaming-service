# Serves the benchmark object as a static file. Range requests, keepalive and
# sendfile are nginx defaults; they are spelled out here so the configuration
# the numbers came from is explicit rather than implied.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Range support is on by default; max_ranges 0 would disable it.
        max_ranges 1;

        # No access log: at benchmark request rates the log write is itself a
        # measurable cost, and none of the other targets are logging either.
        access_log off;

        add_header Accept-Ranges bytes;
        default_type application/octet-stream;
    }
}
