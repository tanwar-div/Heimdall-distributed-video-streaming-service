name: heimdall

x-node-image: &node-build
  build:
    context: .
    dockerfile: storage-node/Dockerfile
  image: heimdall-storage-node:local
  restart: unless-stopped
  environment: &node-env
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-heimdall}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-heimdall-secret}
  depends_on:
    - minio

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-heimdall}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-heimdall-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  primary-0:
    <<: *node-build
    environment:
      <<: *node-env
      SPRING_PROFILES_ACTIVE: primary-0

  primary-0-replica-0:
    <<: *node-build
    environment:
      <<: *node-env
      SPRING_PROFILES_ACTIVE: primary-0-replica-0

  primary-0-replica-1:
    <<: *node-build
    environment:
      <<: *node-env
      SPRING_PROFILES_ACTIVE: primary-0-replica-1

  primary-1:
    <<: *node-build
    environment:
      <<: *node-env
      SPRING_PROFILES_ACTIVE: primary-1

  primary-1-replica-0:
    <<: *node-build
    environment:
      <<: *node-env
      SPRING_PROFILES_ACTIVE: primary-1-replica-0

  primary-1-replica-1:
    <<: *node-build
    environment:
      <<: *node-env
      SPRING_PROFILES_ACTIVE: primary-1-replica-1

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: heimdall-gateway:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      HEIMDALL_API_KEY: ${HEIMDALL_API_KEY:-changeme}
    ports:
      # Host port is overridable because 8080 is a popular port to already have
      # something on (a system Tomcat, another dev stack). The container port
      # stays 8080; set GATEWAY_PORT to move only the published side.
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - primary-0
      - primary-0-replica-0
      - primary-0-replica-1
      - primary-1
      - primary-1-replica-0
      - primary-1-replica-1

volumes:
  minio-data:
